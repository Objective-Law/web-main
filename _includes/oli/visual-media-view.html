{%- assign view = include.view -%}
{%- if view.type == "local" -%}
  {% for item in view.items %}
    {% include oli/visual-media-render-item.html item=item index=forloop.index %}
  {% endfor %}
{%- elsif view.type == "platform" -%}
  {% include oli/visual-media-platform-view.html view=view %}
{%- endif -%}
